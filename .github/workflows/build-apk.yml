name: Build Inventory Management APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Run calculation tests
        run: |
          mkdir -p /tmp/t
          javac -d /tmp/t app/src/main/java/com/rmstock/nativeapp/PlanLogic.java tools/PlanLogicTest.java
          java -cp /tmp/t com.rmstock.nativeapp.PlanLogicTest

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inventory-management-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
